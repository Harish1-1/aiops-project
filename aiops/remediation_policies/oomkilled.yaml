version: 2
id: oomkilled-policy
root_cause: OOMKilled
decision: PATCH
reason: Memory requests and limits are increased proportionally from the current repository values after deterministic OOM evidence.
operations:
- path: /spec/template/spec/containers/{container}/resources/requests/memory
  derive:
    source: manifest
    selector: /spec/template/spec/containers/{container}/resources/requests/memory
    transforms: [{operation: quantity_multiply, factor: 2}]
- path: /spec/template/spec/containers/{container}/resources/limits/memory
  derive:
    source: manifest
    selector: /spec/template/spec/containers/{container}/resources/limits/memory
    transforms: [{operation: quantity_multiply, factor: 2}]
