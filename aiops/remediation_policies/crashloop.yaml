version: 2
id: crashloop-policy
root_cause: CrashLoopBackOff
decision: PATCH
reason: Container startup configuration is restored only from an earlier repository revision of the same workload and container.
operations:
- path: /spec/template/spec/containers/{container}/command
  allow_add: true
  optional: true
  derive: {source: git_history, selector: last_successful_container_command}
- path: /spec/template/spec/containers/{container}/args
  allow_add: true
  optional: true
  derive: {source: git_history, selector: last_successful_container_args}
