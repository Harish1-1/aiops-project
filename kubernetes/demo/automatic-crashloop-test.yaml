apiVersion: apps/v1
kind: Deployment
metadata:
  name: automatic-crashloop-test
  namespace: production
  labels:
    app: automatic-crashloop-test
    aiops.openai/demo: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: automatic-crashloop-test
  template:
    metadata:
      labels:
        app: automatic-crashloop-test
    spec:
      containers:
        - name: crashloop-test
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Automatic AIOps CrashLoopBackOff test"
              echo "Simulated application startup failure"
              exit 1