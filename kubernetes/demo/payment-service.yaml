apiVersion: v1
kind: Namespace
metadata:
  name: production

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: production
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        aiops.openai/demo: "true"
    spec:
      containers:
        - name: payment-service
          image: nginx:1.27-alpine

          # Intentionally causes CrashLoopBackOff for AIOps testing
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting payment-service"
              echo "Simulating payment-service startup failure"
              exit 1

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: production
spec:
  selector:
    app: payment-service
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP