apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-test
  namespace: production
  labels:
    app: oom-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-test
  template:
    metadata:
      labels:
        app: oom-test
    spec:
      containers:
        - name: oom-test
          image: python:3.13-alpine
          command:
            - python
            - -c
            - |
              data = []
              while True:
                  data.append("x" * 10 * 1024 * 1024)
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi