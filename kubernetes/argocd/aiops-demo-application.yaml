apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: aiops-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Harish1-1/aiops-project.git
    targetRevision: main
    path: kubernetes/demo

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true